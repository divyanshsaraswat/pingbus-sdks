name: Publish SDKs

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # Required to create GitHub Release

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # NODE SDK → NPM
  # ────────────────────────────────────────────────────────────────────────────
  publish-node:
    name: Publish Node SDK → NPM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Bump version to match tag
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

      - name: Build
        run: npm run build

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # PYTHON SDK → PyPI
  # ────────────────────────────────────────────────────────────────────────────
  publish-python:
    name: Publish Python SDK → PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Bump version in setup.py
        run: |
          sed -i "s/version=\"[^\"]*\"/version=\"${{ steps.version.outputs.VERSION }}\"/" setup.py

      - name: Build distribution packages
        run: python -m build

      - name: Publish to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # JAVA SDK → Maven Central
  # ────────────────────────────────────────────────────────────────────────────
  publish-java:
    name: Publish Java SDK → Maven Central
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Write Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_USERNAME}</username>
                <password>${env.CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Bump version in pom.xml
        run: |
          mvn versions:set \
            -DnewVersion=${{ steps.version.outputs.VERSION }} \
            -DgenerateBackupPoms=false

      - name: Build, sign and deploy to Maven Central
        run: |
          mvn clean deploy \
            --no-transfer-progress \
            -Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

  # ────────────────────────────────────────────────────────────────────────────
  # GITHUB RELEASE — runs after all three publish jobs succeed
  # ────────────────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-node, publish-python, publish-java]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PingBus SDKs ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## Published Packages

            | SDK | Registry | Package |
            |-----|----------|---------|
            | Node | NPM | [@pingbus/sdk@${{ github.ref_name }}](https://www.npmjs.com/package/@pingbus/sdk) |
            | Python | PyPI | [pingbus==${{ github.ref_name }}](https://pypi.org/project/pingbus/) |
            | Java | Maven Central | [io.github.divyanshsaraswat:pingbus:${{ github.ref_name }}](https://central.sonatype.com/artifact/io.github.divyanshsaraswat/pingbus) |
